<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 Shoebox Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* Consolidated CSS styles */
body {
    font-family: 'Fredoka One', cursive;
    background: linear-gradient(#c62828, #8e0000); 
    margin:0; padding:20px; color:white;
    /* Prevent horizontal scrolling on overflow */
    overflow-x: hidden;
}
label { 
    display:block; 
    margin-top:10px; 
    font-weight:bold; 
    font-family: 'Fredoka One', cursive; 
}
h1 {
    font-family: 'Fredoka One', cursive; 
    font-size: 48px;
    text-align: center;
}
textarea, input { 
    width:100%; 
    padding:10px; 
    border-radius:8px; 
    border:none; 
    margin-top:6px; 
    margin-bottom:15px; 
    font-size:16px;
    font-family: 'Fredoka One', cursive; 
}
button { 
    padding:12px; 
    border-radius:10px; 
    border:none; 
    cursor:pointer; 
    font-size:18px; 
    margin-top:10px; 
    font-weight:bold; 
    width:100%; 
    background:#43a047; 
    color:white;
    font-family: 'Fredoka One', cursive; 
}
button:hover { background:#2e7d32; }
.container { 
    max-width:1200px; 
    margin:auto; 
    /* Padding adjustments for mobile */
    padding-left: 10px;
    padding-right: 10px;
}

/* Styles for the canvas element */
#dashboardCanvas {
    display:block; 
    margin: 20px auto; /* Center the canvas */
    border:2px solid white; 
    border-radius:15px;
    /* Make canvas fluid within its container on mobile */
    max-width: 100%;
    height: auto;
}
/* Style for the status bar */
#updateStatus {
    text-align: center;
    font-size: 18px;
    margin-top: 20px;
    font-weight: bold;
    color: #ffeb3b; /* Yellow/Gold for visibility */
}

/* ------------------- Mobile-Specific CSS (Screen width <= 768px) ------------------- */
@media (max-width: 768px) {
    h1 {
        font-size: 30px; /* Smaller title on mobile */
    }
    .container {
        padding: 10px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>🎁 2025 Ginebra Shoebox of Malasakit - Division Office 🎄</h1>

    <div id="updateStatus">Checking for live data updates every 60 seconds...</div>

    <canvas id="dashboardCanvas" width="1200" height="700"></canvas>

    <h2 style="text-align:center; margin-top: 30px; font-family: 'Fredoka One', cursive;">Local Data Preview (Not Global Save)</h2>
    <p style="text-align:center;">Edit the fields below to see the dashboard change. **To save these changes globally, a separate admin page is usually needed.**</p>
    
    <label for="deptInput">Departments (Comma Separated):</label>
    <textarea id="deptInput" rows="2"></textarea>
    <label for="boxInput">Shoeboxes Received (Comma Separated Values, must match Departments count):</label>
    <textarea id="boxInput" rows="2"></textarea>
    <label for="targetInput">Total Target:</label>
    <input id="targetInput" type="number" value="1500">
    
    <button onclick="updateData()">Update Dashboard View</button>
    <button onclick="exportPNG()">📸 Export PNG</button>
    <button onclick="exportGIF()">🎬 Export Animated GIF (takes time)</button>
</div>

<script>
// ---------------- Global Variables & Setup ----------------
var canvas;
var ctx;

let departments = []; 
let boxes = []; 
let target = 1500; 
let totalBoxes = 0; 

// New: Polling interval ID
let dataPollingInterval;

// Dimensions state (will be set in initializeDashboard)
let isMobile = false; 
let CANVAS_WIDTH = 1200;
let CANVAS_HEIGHT = 700;

// Dynamic Chart Layout Variables (will change based on isMobile)
let chartX, chartY, chartWidth, chartHeight;
let tubeX, tubeY, tubeWidth, tubeHeight;


// Department chart colors from v29 (more Christmassy/Pastel)
const pastelColors=["#FFB3BA","#FFDFBA","#FFFFBA","#BAFFC9","#BAE1FF","#E3BAFF","#FFCFF0","#C7F0FF"];
const icons=["🎁","🎄","⛄","🔔","🧦","🕯️","❄️","🍪","🧸","🛷"]; // Icons from v29

// Snowflake variables
let snowflakes = [];
// Tube animation state
let tubeGradientOffset = 0;
let sparkles = [];

// Helper for roundRect (from v29)
CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
};


// ---------------- Ethereal Snowflake Class (from v29) ----------------
class Snowflake {
    constructor() { this.reset(); }
    reset() {
        // Use dynamic canvas width/height
        this.x = Math.random() * CANVAS_WIDTH; 
        this.y = Math.random() * CANVAS_HEIGHT;
        this.size = 2 + Math.random() * 4;
        this.speed = 0.2 + Math.random() * 1.2;
        this.angle = Math.random() * Math.PI * 2;
        this.opacity = 0.2 + Math.random() * 0.4;
        this.rotationSpeed = 0.001 + Math.random() * 0.002;
    }
    update() {
        this.y += this.speed;
        this.x += Math.sin(this.angle) * 0.5;
        this.angle += this.rotationSpeed;
        // Check for boundary reset (use dynamic dimensions)
        if (this.y > CANVAS_HEIGHT || this.x < 0 || this.x > CANVAS_WIDTH) this.reset();
    }
    draw(ctx){
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle * 5);
        ctx.strokeStyle = `rgba(255,255,255,${this.opacity})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        // Drawing a star shape for more complex snowflakes
        for(let i = 0; i < 6; i++){ ctx.moveTo(0,0); ctx.lineTo(0, this.size); ctx.rotate(Math.PI / 3);}
        ctx.stroke();
        ctx.restore();
    }
}
function initSnowflakes() {
    snowflakes = [];
    for(let i = 0; i < (isMobile ? 50 : 100); i++) snowflakes.push(new Snowflake());
}
function drawSnow() {
    snowflakes.forEach(f => { f.update(); f.draw(ctx); });
}

// ---------------- Drawing Functions ----------------

// Background (from v29, using gradient)
function drawBackground(){
    const grad=ctx.createLinearGradient(0,0,0,CANVAS_HEIGHT); // Use dynamic height
    grad.addColorStop(0,"#c62828");
    grad.addColorStop(1,"#8e0000");
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT); // Use dynamic width/height
}

// Department Chart (Dynamic rows, rotated labels)
function drawDepartmentChart(){
    // Use dynamic chart dimensions
    const numDeps = departments.length;
    
    // Determine number of rows for department chart on mobile
    let rows = isMobile ? (numDeps > 9 ? 3 : (numDeps > 4 ? 2 : 1)) : 2;
    
    const countPerRow = Math.ceil(numDeps / rows);
    const rowHeight = chartHeight / rows;
    const maxBox=Math.max(...boxes, target * 0.1); 

    // Graph Title: Fredoka One
    ctx.font= isMobile ? "24px Fredoka One" : "32px Fredoka One"; 
    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.fillText("Shoebox Collection Progress", chartX+chartWidth/2, chartY- (isMobile ? 30 : 50)); 

    // Labels/Values: Fredoka One
    ctx.textAlign="center";

    for(let row=0; row<rows; row++){
        const startIdx = row * countPerRow;
        const endIdx = Math.min(startIdx + countPerRow, numDeps);
        const yOffset = chartY + row * rowHeight;
        if(startIdx >= endIdx) continue; 

        const depCountInRow = endIdx - startIdx;
        const barArea = depCountInRow > 0 ? chartWidth / depCountInRow : chartWidth;
        const barWidth = barArea * 0.6;
        const spacing = barArea * 0.2; 

        for(let i=startIdx;i<endIdx;i++){
            const b=boxes[i];
            const barHeight=(b/maxBox)*rowHeight;
            const x = chartX + (i-startIdx)*barArea + spacing;
            const y = yOffset + rowHeight - barHeight;

            // Draw bar
            ctx.fillStyle=pastelColors[i % pastelColors.length];
            ctx.fillRect(x,y,barWidth,barHeight);

            // Draw value above bar
            ctx.fillStyle="white";
            ctx.font= isMobile ? "18px Fredoka One" : "28px Fredoka One"; // Value font
            ctx.fillText(b, x+barWidth/2, y-5);

            // Draw department label below the bars, diagonal
            ctx.save();
            ctx.translate(x + barWidth/2, yOffset + rowHeight + (isMobile ? 25 : 35)); 
            ctx.rotate(-Math.PI/6); 
            ctx.fillStyle="white";
            ctx.font= isMobile ? "16px Fredoka One" : "20px Fredoka One"; // Label font
            ctx.fillText(icons[i % icons.length]+" "+departments[i], 0, 0);
            ctx.restore();
        }
    }

    // Y-axis (vertical line)
    ctx.strokeStyle="white";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(chartX, chartY);
    ctx.lineTo(chartX, chartY+chartHeight);
    ctx.stroke();
}

// Tube (with rounded rectangle, gradient animation, and sparkles)
function drawTube(){
    // Use dynamic tube dimensions
    const percent=Math.min(totalBoxes/target,1);
    const fillHeight=tubeHeight*percent;

    // Tube border
    ctx.beginPath();
    ctx.roundRect(tubeX,tubeY,tubeWidth,tubeHeight, tubeWidth/2); // Dynamic radius
    ctx.strokeStyle="white";
    ctx.lineWidth=4;
    ctx.stroke();

    // Overall Progress Title: Fredoka One
    ctx.font = isMobile ? "24px Fredoka One" : "32px Fredoka One"; 
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.fillText("Overall Progress", tubeX + tubeWidth / 2, tubeY - (isMobile ? 30 : 50)); 

    // Clip to tube
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(tubeX,tubeY,tubeWidth,tubeHeight, tubeWidth/2);
    ctx.clip();

    // Continuous gradient animation
    const grad=ctx.createLinearGradient(tubeX+tubeGradientOffset, tubeY+tubeHeight-fillHeight, tubeX+tubeWidth+tubeGradientOffset, tubeY+tubeHeight);
    for(let i=0;i<pastelColors.length;i++) grad.addColorStop(i/(pastelColors.length-1), pastelColors[i]);
    ctx.fillStyle=grad;
    ctx.fillRect(tubeX, tubeY+tubeHeight-fillHeight, tubeWidth, fillHeight);

    tubeGradientOffset+=0.5;
    if(tubeGradientOffset>tubeWidth) tubeGradientOffset=0;

    // Sparkles
    if(sparkles.length === 0 || sparkles[0].y > CANVAS_HEIGHT){ // Re-initialize if dimensions change significantly
        sparkles = [];
        for(let i=0;i<(isMobile ? 15 : 25);i++){
            sparkles.push({x:Math.random()*tubeWidth, y:Math.random()*tubeHeight, radius:1+Math.random()*2, alpha:Math.random()*0.6+0.3, delta:Math.random()*0.02+0.01});
        }
    }
    sparkles.forEach(s=>{
        // Only draw sparkles inside the filled area
        if (s.y <= fillHeight) {
            s.alpha+=s.delta;
            if(s.alpha>1 || s.alpha<0.2) s.delta*=-1;
            ctx.fillStyle=`rgba(255,255,255,${s.alpha})`;
            ctx.beginPath();
            // s.y is relative to the bottom of the fill. fillHeight - s.y gives position from top of fill.
            ctx.arc(tubeX+s.x, tubeY+tubeHeight-s.y, s.radius,0,Math.PI*2); 
            ctx.fill();
        }
    });

    ctx.restore(); // Stop clipping

    // Target line 
    const targetY = tubeY;
    ctx.strokeStyle = "#ffeb3b";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tubeX - 10, targetY);
    ctx.lineTo(tubeX + tubeWidth + 10, targetY);
    ctx.stroke();

    // Label: Fredoka One
    ctx.font=isMobile ? "24px Fredoka One" : "32px Fredoka One"; 
    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.fillText(totalBoxes+" / "+target, tubeX+tubeWidth/2, tubeY+tubeHeight+ (isMobile ? 30 : 45)); 
}

// ---------------- Main Draw Loop ----------------
function drawDashboard(){
    drawBackground();
    drawSnow();
    drawDepartmentChart();
    drawTube();
    requestAnimationFrame(drawDashboard);
}

// ---------------- Input & Export ----------------
function updateData(){
    // Update local variables from text inputs
    departments=document.getElementById("deptInput").value.split(",").map(a=>a.trim()).filter(d => d.length > 0);
    boxes=document.getElementById("boxInput").value.split(",").map(a=>Number(a));
    target=Number(document.getElementById("targetInput").value);
    totalBoxes = boxes.reduce((a, b) => a + b, 0); // Recalculate total
    setupDimensions(); // Recalculate layout based on new department count
}

function exportPNG(){
    const dataURL=canvas.toDataURL("image/png");
    const link=document.createElement('a');
    link.href=dataURL;
    link.download="shoebox-dashboard.png";
    link.click();
}

function exportGIF(){
    const gif=new GIF({workers:2,quality:10,width:CANVAS_WIDTH,height:CANVAS_HEIGHT}); // Use dynamic dimensions
    let frames=0;
    const captureFrame=()=>{
        if(frames<50){
            gif.addFrame(canvas,{copy:true,delay:50});
            frames++;
            requestAnimationFrame(captureFrame);
        } else {
            gif.on('finished', blob=>window.open(URL.createObjectURL(blob)));
            gif.render();
        }
    };
    captureFrame();
}

// --- Data Fetcher ---
async function loadData() {
    try {
        // Use cache-busting to ensure we always get the LATEST deployed data.json
        document.getElementById('updateStatus').textContent = "Checking for new data...";
        const response = await fetch('data.json?' + new Date().getTime()); 
        if (!response.ok) throw new Error('Failed to fetch data.json');
        const data = await response.json();
        
        departments = data.departments || [];
        boxes = data.boxes || [];
        target = data.target || 0;
        
        // Indicate successful poll
        document.getElementById('updateStatus').textContent = `Data last checked: ${new Date().toLocaleTimeString()} | Auto-polling every 60s.`;

    } catch (error) {
        console.warn('Error loading data.json, using fallback data:', error);
        // Fallback data
        departments = ["HR", "Finance", "Logistics", "Sales", "IT", "Marketing", "Admin", "Customer Service", "Procurement", "R&D"];
        boxes = [120, 95, 160, 180, 140, 100, 80, 110, 70, 90];
        target = 1500;
        document.getElementById('updateStatus').textContent = `WARNING: Failed to load live data! Using fallback data.`;
    }

    totalBoxes = boxes.reduce((a, b) => a + b, 0); // Calculate total

    // Update input fields for preview
    document.getElementById('deptInput').value = departments.join(', ');
    document.getElementById('boxInput').value = boxes.join(', ');
    document.getElementById('targetInput').value = target;
}

// --- New Polling Function ---
function startPolling() {
    // Check for new data every 60 seconds (60000 milliseconds)
    dataPollingInterval = setInterval(loadData, 60000); 
}

// --- Responsive Logic ---
function setupDimensions() {
    isMobile = window.innerWidth <= 768;
    const numDeps = departments.length;
    
    if (isMobile) {
        // Calculate the height needed for the department chart based on rows (max 3)
        let rows = numDeps > 9 ? 3 : (numDeps > 4 ? 2 : 1);
        
        // Base height for one row (including title/padding/labels)
        const rowDisplayHeight = 150; 
        
        // Calculate Dept Chart height: 50 (title offset) + rows * 150 (row height) + 40 (label space)
        chartHeight = rows * rowDisplayHeight; 
        const deptChartTotalHeight = chartHeight + 90; // Add space for title and axis labels

        CANVAS_WIDTH = window.innerWidth - 40; // Full width minus padding
        // Set height for stacked view: Dept Chart + Tube Chart + Padding
        CANVAS_HEIGHT = deptChartTotalHeight + 450; // Total height for Dept chart + 450 for tube/padding
        
        // Department Chart (Top, takes most of the width)
        chartX = 20;
        chartY = 50;
        chartWidth = CANVAS_WIDTH - 40;
        
        // Tube Chart (Bottom, centered)
        tubeWidth = 100;
        tubeHeight = 300;
        tubeX = (CANVAS_WIDTH / 2) - (tubeWidth / 2);
        tubeY = chartY + deptChartTotalHeight + 50; // Place below the dept chart, with a gap
        
    } else {
        // Desktop Layout (Original)
        CANVAS_WIDTH = 1200;
        CANVAS_HEIGHT = 700;
        
        chartX = 50; 
        chartY = 150; 
        chartWidth = 750; 
        chartHeight = 480;
        
        tubeX = 850;
        tubeY = 150;
        tubeWidth = 150;
        tubeHeight = 480;
    }
    
    // Apply dimensions to canvas element
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;
    
    // Re-initialize snowflakes with new dimensions
    initSnowflakes();
}

// --- Initial setup function ---
async function initializeDashboard() {
    canvas = document.getElementById('dashboardCanvas');
    ctx = canvas.getContext('2d');
    
    // 1. Load data once immediately
    await loadData(); 
    
    // 2. Set initial dimensions based on screen size (which depends on loaded data)
    setupDimensions(); 
    
    // 3. Re-run setup dimensions on window resize (to handle orientation change)
    window.addEventListener('resize', setupDimensions); 
    
    // 4. Start polling for future changes
    startPolling(); 
    
    // 5. Start animation loop
    drawDashboard(); 
}

// Start everything when the page is fully loaded
window.onload = initializeDashboard;
</script>
</body>
</html>
