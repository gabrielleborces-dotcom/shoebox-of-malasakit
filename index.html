<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎄 Shoebox Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Fredoka One', cursive;
    background: linear-gradient(#c62828, #8e0000);
    margin:0; padding:20px; color:white;
}
label { display:block; margin-top:10px; font-weight:bold; font-family: 'Fredoka One', cursive;}
textarea,input { width:100%; padding:10px; border-radius:8px; border:none; margin-top:6px; margin-bottom:15px; font-size:16px;}
button { padding:12px; border-radius:10px; border:none; cursor:pointer; font-size:18px; margin-top:10px; font-weight:bold; width:100%; background:#43a047; color:white;}
button:hover { background:#2e7d32; }
.container { max-width:1200px; margin:auto; }
#canvas { display:block; background-color:black; margin-bottom:20px; border-radius:10px;}
.input-panel {
    background: rgba(0,0,0,0.2);
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
}
</style>
</head>
<body>
<div class="container">
    <h1 style="text-align:center; font-family: 'Mountains of Christmas', cursive; font-size: 3em;">🎁 Shoebox of Malasakit Dashboard</h1>
    <canvas id="canvas" width="1000" height="700"></canvas>

    <div class="input-panel">
        <h2>Edit Data (Local Only)</h2>
        <label for="deptInput">Departments (Comma Separated):</label>
        <textarea id="deptInput" rows="2" oninput="updateData()"></textarea>
        <label for="boxInput">Shoeboxes Received (Comma Separated Values):</label>
        <textarea id="boxInput" rows="2" oninput="updateData()"></textarea>
        <label for="targetInput">Total Target:</label>
        <input id="targetInput" type="number" oninput="updateData()">
        <button onclick="updateData()">Apply Local Changes</button>
        <button onclick="exportPNG()">Export to PNG</button>
        <button onclick="exportGIF()">Export to GIF</button>
        <p style="font-size: 0.8em; margin-top: 10px;">*Changes made here are only visible on your browser unless an Admin commits them via the /admin.html page.</p>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let departments = [];
let boxes = [];
let target = 0;
let totalBoxes = 0;

// --- Animation/Visual Variables ---
let snow = [];
const numSnowflakes = 100;

function setupSnow() {
    snow = [];
    for (let i = 0; i < numSnowflakes; i++) {
        snow.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 3 + 1, // radius
            d: Math.random() * numSnowflakes // density
        });
    }
}

function drawBackground() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, '#c62828'); // Dark Red Top
    gradient.addColorStop(1, '#8e0000'); // Darker Red Bottom
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawSnow() {
    ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    ctx.beginPath();
    for (let i = 0; i < numSnowflakes; i++) {
        const p = snow[i];
        ctx.moveTo(p.x, p.y);
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
    }
    ctx.fill();
    
    // Update snow position
    for (let i = 0; i < numSnowflakes; i++) {
        const p = snow[i];
        p.y += Math.cos(p.d) + 1 + p.r / 2;
        p.x += Math.sin(p.d) * 0.4;
        
        // Send flakes back to the top when they fall off
        if (p.y > canvas.height) {
            p.y = -5;
            p.x = Math.random() * canvas.width;
        }
    }
}

    // Chart Area
    const chartX = 50;
    const chartY = 100;
    const chartWidth = canvas.width - 450;
    const chartHeight = 500;

    // Draw Chart Background
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(chartX, chartY, chartWidth, chartHeight);

    ctx.font = "20px Fredoka One";
    ctx.fillStyle = "white";
    ctx.textAlign = "right";
    ctx.fillText("Shoeboxes", chartX - 10, chartY - 10);

    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 2;
    ctx.beginPath
