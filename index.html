<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎄 Shoebox Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mountains+of+Christmas:wght=700&display=swap" rel="stylesheet">
<style>
/* Consolidated CSS styles */
body {
    font-family: 'Fredoka One', cursive;
    background: linear-gradient(#c62828, #8e0000); /* Use v29's gradient background */
    margin:0; padding:20px; color:white;
}
label { 
    display:block; 
    margin-top:10px; 
    font-weight:bold; 
    font-family: 'Fredoka One', cursive; /* Explicitly ensure label matches body font */
}
textarea, input { 
    width:100%; 
    padding:10px; 
    border-radius:8px; 
    border:none; 
    margin-top:6px; 
    margin-bottom:15px; 
    font-size:16px;
    font-family: 'Fredoka One', cursive; /* Added Fredoka One to input fields for fun style */
}
button { 
    padding:12px; 
    border-radius:10px; 
    border:none; 
    cursor:pointer; 
    font-size:18px; 
    margin-top:10px; 
    font-weight:bold; 
    width:100%; 
    background:#43a047; 
    color:white;
    font-family: 'Fredoka One', cursive; /* Added Fredoka One to buttons */
}
button:hover { background:#2e7d32; }
.container { max-width:1200px; margin:auto; }

/* Styles for the canvas element */
#dashboardCanvas {
    display:block; 
    margin-top:20px; 
    border:2px solid white; 
    border-radius:15px;
}
</style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center; font-family:'Mountains of Christmas', cursive; font-size:48px;">🎅 2025 Ginebra Shoebox Dashboard 🎄</h1>

    <canvas id="dashboardCanvas" width="1200" height="700"></canvas>

    <h2 style="text-align:center; margin-top: 30px;">Local Data Preview (Not Global Save)</h2>
    <p style="text-align:center;">Edit the fields below to see the dashboard change. **To save these changes globally, a separate admin page is usually needed.**</p>
    
    <label for="deptInput">Departments (Comma Separated):</label>
    <textarea id="deptInput" rows="2"></textarea>
    <label for="boxInput">Shoeboxes Received (Comma Separated Values, must match Departments count):</label>
    <textarea id="boxInput" rows="2"></textarea>
    <label for="targetInput">Total Target:</label>
    <input id="targetInput" type="number" value="1500">
    
    <button onclick="updateData()">Update Dashboard View</button>
    <button onclick="exportPNG()">📸 Export PNG</button>
    <button onclick="exportGIF()">🎬 Export Animated GIF (takes time)</button>
</div>

<script>
// ---------------- Global Variables & Setup ----------------
var canvas;
var ctx;

let departments = []; // Will be loaded from data.json or initial v29 values
let boxes = []; // Will be loaded from data.json or initial v29 values
let target = 1500; // Will be loaded from data.json or initial v29 value
let totalBoxes = 0; // Calculated sum of boxes

// Department chart colors from v29 (more Christmassy/Pastel)
const pastelColors=["#FFB3BA","#FFDFBA","#FFFFBA","#BAFFC9","#BAE1FF","#E3BAFF","#FFCFF0","#C7F0FF"];
const icons=["🎁","🎄","⛄","🔔","🧦","🕯️","❄️","🍪","🧸","🛷"]; // Icons from v29

// Snowflake variables
let snowflakes = [];
// Tube animation state
let tubeGradientOffset = 0;
let sparkles = [];

// Helper for roundRect (from v29)
CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
};


// ---------------- Ethereal Snowflake Class (from v29) ----------------
class Snowflake {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = 2 + Math.random() * 4;
        this.speed = 0.2 + Math.random() * 1.2;
        this.angle = Math.random() * Math.PI * 2;
        this.opacity = 0.2 + Math.random() * 0.4;
        this.rotationSpeed = 0.001 + Math.random() * 0.002;
    }
    update() {
        this.y += this.speed;
        this.x += Math.sin(this.angle) * 0.5;
        this.angle += this.rotationSpeed;
        // Check for boundary reset
        if (this.y > canvas.height || this.x < 0 || this.x > canvas.width) this.reset();
    }
    draw(ctx){
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle * 5);
        ctx.strokeStyle = `rgba(255,255,255,${this.opacity})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        // Drawing a star shape for more complex snowflakes
        for(let i = 0; i < 6; i++){ ctx.moveTo(0,0); ctx.lineTo(0, this.size); ctx.rotate(Math.PI / 3);}
        ctx.stroke();
        ctx.restore();
    }
}
function initSnowflakes() {
    snowflakes = [];
    for(let i = 0; i < 100; i++) snowflakes.push(new Snowflake());
}
function drawSnow() {
    snowflakes.forEach(f => { f.update(); f.draw(ctx); });
}

// ---------------- Drawing Functions ----------------

// Background (from v29, using gradient)
function drawBackground(){
    const grad=ctx.createLinearGradient(0,0,0,canvas.height);
    grad.addColorStop(0,"#c62828");
    grad.addColorStop(1,"#8e0000");
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);
}

// Department Chart (from v29, 2 rows, rotated labels)
function drawDepartmentChart(){
    const chartX=50, chartY=150, chartWidth=650, chartHeight=500;
    const numDeps = departments.length;
    const half = Math.ceil(numDeps/2);
    const rowHeight = chartHeight/2;
    const maxBox=Math.max(...boxes, target * 0.1); // Use target * 0.1 as a minimum for scaling

    // Graph Title
    ctx.font="28px Mountains of Christmas";
    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.fillText("2025 Ginebra Shoebox of Malasakit Collection", chartX+chartWidth/2, chartY-40);

    ctx.font="20px Fredoka One";
    ctx.textAlign="center";

    for(let row=0; row<2; row++){
        const startIdx = row*half;
        const endIdx = Math.min(startIdx+half, numDeps);
        const yOffset = chartY + row*rowHeight;
        if(startIdx >= endIdx) continue; // Skip if no departments in row

        const depCountInRow = endIdx - startIdx;
        const barArea = chartWidth / depCountInRow;
        const barWidth = barArea * 0.6;
        const spacing = barArea * 0.2; // Equivalent to (barArea - barWidth)/2 on each side

        for(let i=startIdx;i<endIdx;i++){
            const b=boxes[i];
            const barHeight=(b/maxBox)*rowHeight;
            const x = chartX + (i-startIdx)*barArea + spacing;
            const y = yOffset + rowHeight - barHeight;

            // Draw bar
            ctx.fillStyle=pastelColors[i % pastelColors.length];
            ctx.fillRect(x,y,barWidth,barHeight);

            // Draw value above bar
            ctx.fillStyle="white";
            ctx.fillText(b, x+barWidth/2, y-10);

            // Draw department label below the bars, diagonal
            ctx.save();
            ctx.translate(x + barWidth/2, yOffset + rowHeight + 30); // move below axis
            ctx.rotate(-Math.PI/6); // rotate 30 degrees
            ctx.fillStyle="white";
            ctx.fillText(icons[i % icons.length]+" "+departments[i], 0, 0);
            ctx.restore();
        }
    }

    // Y-axis (vertical line)
    ctx.strokeStyle="white";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(chartX, chartY);
    ctx.lineTo(chartX, chartY+chartHeight);
    ctx.stroke();
}

// Tube (from v29, with rounded rectangle, gradient animation, and sparkles)
function drawTube(){
    const tubeX=750,tubeY=150,tubeWidth=150,tubeHeight=500;
    const percent=Math.min(totalBoxes/target,1);
    const fillHeight=tubeHeight*percent;

    // Tube border
    ctx.beginPath();
    ctx.roundRect(tubeX,tubeY,tubeWidth,tubeHeight,75);
    ctx.strokeStyle="white";
    ctx.lineWidth=4;
    ctx.stroke();

    // Overall Progress Title (moved from index.html)
    ctx.font = "28px Mountains of Christmas";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.fillText("Overall Progress", tubeX + tubeWidth / 2, tubeY - 40);

    // Clip to tube
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(tubeX,tubeY,tubeWidth,tubeHeight,75);
    ctx.clip();

    // Continuous gradient animation
    const grad=ctx.createLinearGradient(tubeX+tubeGradientOffset, tubeY+tubeHeight-fillHeight, tubeX+tubeWidth+tubeGradientOffset, tubeY+tubeHeight);
    for(let i=0;i<pastelColors.length;i++) grad.addColorStop(i/(pastelColors.length-1), pastelColors[i]);
    ctx.fillStyle=grad;
    ctx.fillRect(tubeX, tubeY+tubeHeight-fillHeight, tubeWidth, fillHeight);

    tubeGradientOffset+=0.5;
    if(tubeGradientOffset>tubeWidth) tubeGradientOffset=0;

    // Sparkles
    if(sparkles.length === 0){
        for(let i=0;i<25;i++){
            sparkles.push({x:Math.random()*tubeWidth, y:Math.random()*tubeHeight, radius:1+Math.random()*2, alpha:Math.random()*0.6+0.3, delta:Math.random()*0.02+0.01});
        }
    }
    sparkles.forEach(s=>{
        // Only draw sparkles inside the filled area
        if (s.y <= fillHeight) {
            s.alpha+=s.delta;
            if(s.alpha>1 || s.alpha<0.2) s.delta*=-1;
            ctx.fillStyle=`rgba(255,255,255,${s.alpha})`;
            ctx.beginPath();
            // s.y is relative to the bottom of the fill. fillHeight - s.y gives position from top of fill.
            ctx.arc(tubeX+s.x, tubeY+tubeHeight-s.y, s.radius,0,Math.PI*2); 
            ctx.fill();
        }
    });

    ctx.restore(); // Stop clipping

    // Target line (Always at the top of the tube if the bar represents the target, adjusted for the new tube position)
    const targetY = tubeY;
    ctx.strokeStyle = "#ffeb3b";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tubeX - 10, targetY);
    ctx.lineTo(tubeX + tubeWidth + 10, targetY);
    ctx.stroke();

    // Label
    ctx.font="28px Fredoka One";
    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.fillText(totalBoxes+" / "+target, tubeX+tubeWidth/2, tubeY+tubeHeight+40);
}

// ---------------- Main Draw Loop ----------------
function drawDashboard(){
    drawBackground();
    drawSnow();
    drawDepartmentChart();
    drawTube();
    requestAnimationFrame(drawDashboard);
}

// ---------------- Input & Export ----------------
function updateData(){
    // Update local variables from text inputs
    departments=document.getElementById("deptInput").value.split(",").map(a=>a.trim()).filter(d => d.length > 0);
    boxes=document.getElementById("boxInput").value.split(",").map(a=>Number(a));
    target=Number(document.getElementById("targetInput").value);
    totalBoxes = boxes.reduce((a, b) => a + b, 0); // Recalculate total
}

function exportPNG(){
    const dataURL=canvas.toDataURL("image/png");
    const link=document.createElement('a');
    link.href=dataURL;
    link.download="shoebox-dashboard.png";
    link.click();
}

function exportGIF(){
    // The GIF creation function is working as intended.
    const gif=new GIF({workers:2,quality:10,width:canvas.width,height:canvas.height});
    let frames=0;
    const captureFrame=()=>{
        if(frames<50){
            gif.addFrame(canvas,{copy:true,delay:50});
            frames++;
            requestAnimationFrame(captureFrame);
        } else {
            gif.on('finished', blob=>window.open(URL.createObjectURL(blob)));
            gif.render();
        }
    };
    captureFrame();
}

// --- Data Fetcher (from index.html) ---
async function loadData() {
    try {
        // Attempt to fetch data.json for a dynamic, shared experience
        const response = await fetch('data.json?' + new Date().getTime()); 
        if (!response.ok) throw new Error('Failed to fetch data.json');
        const data = await response.json();
        
        departments = data.departments || [];
        boxes = data.boxes || [];
        target = data.target || 0;
        
    } catch (error) {
        console.warn('Error loading data.json, using fallback data:', error);
        // Fallback data from the original v29 file
        departments = ["HR", "Finance", "Logistics", "Sales", "IT", "Marketing", "Admin", "Customer Service", "Procurement", "R&D"];
        boxes = [120, 95, 160, 180, 140, 100, 80, 110, 70, 90];
        target = 1500;
    }

    totalBoxes = boxes.reduce((a, b) => a + b, 0); // Calculate total

    // Update input fields for preview
    document.getElementById('deptInput').value = departments.join(', ');
    document.getElementById('boxInput').value = boxes.join(', ');
    document.getElementById('targetInput').value = target;
}

// --- Initial setup function ---
async function initializeDashboard() {
    canvas = document.getElementById('dashboardCanvas');
    ctx = canvas.getContext('2d');
    
    initSnowflakes();

    await loadData(); // Load data before starting the draw loop
    
    drawDashboard(); 
}

// Start everything when the page is fully loaded
window.onload = initializeDashboard;
</script>
</body>
</html>
