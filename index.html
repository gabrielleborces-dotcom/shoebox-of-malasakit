<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎄 Shoebox Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Fredoka One', cursive; background: linear-gradient(#c62828, #8e0000); margin:0; padding:20px; color:white; }
label { display:block; margin-top:10px; font-weight:bold; font-family: 'Fredoka One', cursive;}
textarea,input { width:100%; padding:10px; border-radius:8px; border:none; margin-top:6px; margin-bottom:15px; font-size:16px;}
button { padding:12px; border-radius:10px; border:none; cursor:pointer; font-size:18px; margin-top:10px; font-weight:bold; width:100%; background:#43a047; color:white;}
button:hover { background:#2e7d32; }
.container { max-width:1200px; margin:auto; }
</style>
</head>
<body>
<div class="container">
<h1 style="text-align:center; font-family:'Mountains of Christmas', cursive; font-size:48px;">🎅 2025 Ginebra Shoebox Dashboard 🎄</h1>

<label>Departments:</label>
<textarea id="deptInput"></textarea>
<label>Shoeboxes Received:</label>
<textarea id="boxInput"></textarea>
<label>Total Target:</label>
<input id="targetInput" type="number">
<button onclick="updateData()">Update Dashboard (Local Only)</button>
<button onclick="exportPNG()">📸 Export PNG</button>
<button onclick="exportGIF()">🎬 Export Animated GIF</button>

<canvas id="dashboardCanvas" width="1200" height="700" style="display:block; margin-top:20px; border:2px solid white; border-radius:15px;"></canvas>
</div>

<script>
const canvas=document.getElementById('dashboardCanvas');
const ctx=canvas.getContext('2d');

let departments=[];
let boxes=[];
let target=0;

const pastelColors=["#FFB3BA","#FFDFBA","#FFFFBA","#BAFFC9","#BAE1FF","#E3BAFF","#FFCFF0","#C7F0FF"];
const icons=["🎁","🎄","⛄","🔔","🧦","🕯️","❄️","🍪","🧸","🛷"];

// ... (Snowflake and Drawing functions omitted for brevity, they are correct) ...

// ---------------- Data Loading Function (Async/Await) ----------------
async function loadData() {
    try {
        // *** CRITICAL CACHE-BUSTING FIX ***
        const cacheBustingUrl = 'data.json?' + new Date().getTime(); 
        const response = await fetch(cacheBustingUrl);
        
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();

        // Update global variables
        departments = data.departments || [];
        boxes = data.boxes || [];
        target = data.target || 0;
        
        // Update the input fields with the new data from data.json (for local display)
        document.getElementById("deptInput").value = departments.join(', ');
        document.getElementById("boxInput").value = boxes.join(', ');
        document.getElementById("targetInput").value = target;

    } catch (error) {
        console.error("Failed to load data.json. Using current local data.", error);
    }
}


// ---------------- Main Draw ----------------
function drawDashboard(){
    // ... (Drawing logic) ...
    requestAnimationFrame(drawDashboard);
}

// ---------------- Input & Export ----------------
function updateData(){
    // ... (Local update logic) ...
}
function exportPNG(){
    // ... (Export logic) ...
}
function exportGIF(){
    // ... (Export logic) ...
}

// --- Initial setup function: Ensures data is loaded BEFORE drawing starts ---
async function initializeDashboard() {
    await loadData();
    drawDashboard();
}

initializeDashboard();
</script>
</body>
</html>
