<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔒 Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
body { font-family: 'Fredoka One', cursive; background: #004d40; margin: 0; padding: 20px; color: white; }
.container { max-width: 600px; margin: auto; padding: 30px; background: #00695c; border-radius: 10px; }
h1 { text-align: center; font-size: 32px; margin-bottom: 20px; color: #a7ffeb; }
label { display: block; margin-top: 15px; font-weight: bold; }
textarea, input[type="text"], input[type="number"], input[type="password"] { width: 100%; padding: 10px; border-radius: 6px; border: none; margin-top: 6px; font-size: 16px; box-sizing: border-box; }
button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 18px; margin-top: 25px; font-weight: bold; width: 100%; background: #ff6f00; color: white; transition: background 0.3s; }
button:hover { background: #e65100; }
#statusMessage { margin-top: 20px; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; display: none; }
.success { background-color: #4CAF50; display: block !important; }
.error { background-color: #f44336; display: block !important; }
</style>
</head>
<body>
<div class="container">
    <h1>🔑 Shoebox Admin Commit</h1>

    <label for="deptInput">Departments (Comma Separated):</label>
    <textarea id="deptInput" rows="4"></textarea>

    <label for="boxInput">Shoeboxes Received (Comma Separated Values, must match Departments count):</label>
    <textarea id="boxInput" rows="4"></textarea>

    <label for="targetInput">Total Target:</label>
    <input id="targetInput" type="number" value="1000">

    <label for="passwordInput">Admin Password:</label>
    <input id="passwordInput" type="password">

    <button onclick="commitData()">Commit Changes to GitHub & Redeploy</button>
    
    <div id="statusMessage"></div>
</div>

<script>
const statusMessage = document.getElementById('statusMessage');

async function loadCurrentData() {
    try {
        // Use cache-busting here too, just in case the admin panel is cached
        const response = await fetch('data.json?' + new Date().getTime());
        if (!response.ok) throw new Error('Failed to fetch data.json');
        const data = await response.json();
        
        document.getElementById('deptInput').value = (data.departments || []).join(', ');
        document.getElementById('boxInput').value = (data.boxes || []).join(', ');
        document.getElementById('targetInput').value = data.target || 0;
    } catch (error) {
        showStatus('error', 'Failed to load current data. Enter all values manually.', true);
    }
}

async function commitData() {
    showStatus('', '', false); 

    const departments = document.getElementById('deptInput').value.split(',').map(a => a.trim()).filter(a => a.length > 0);
    const boxValues = document.getElementById('boxInput').value.split(',').map(a => a.trim());
    const boxes = boxValues.map(a => Number(a));
    const target = Number(document.getElementById('targetInput').value);
    const adminPassword = document.getElementById('passwordInput').value;
    
    if (departments.length !== boxes.length) {
        showStatus('error', 'Error: Department count must match Box count.', true);
        return;
    }
    if (!adminPassword) {
        showStatus('error', 'Error: Please enter the Admin Password.', true);
        return;
    }

    const payload = {
        // Data structure matching data.json
        departments: departments,
        boxes: boxes,
        target: target
        // *** CRITICAL CHANGE for updateData.js: We need to specify the repo info in the body ***
        // However, looking at your updateData.js, the owner/repo is hardcoded, so we only send the data:
    };

    try {
        showStatus('', 'Committing data to GitHub...', true);
        
        const response = await fetch('/.netlify/functions/updateData', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                // This header authenticates the request against the Netlify Function
                'X-Admin-Password': adminPassword 
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.success) {
            showStatus('success', '✅ Success! Data committed to GitHub. Site is now redeploying.', true);
        } else {
            const errorMessage = result.message || 'Unknown error occurred.';
            if (response.status === 403) {
                showStatus('error', '❌ Commit Failed: Invalid admin password.', true);
            } else {
                showStatus('error', `❌ GitHub update failed: ${errorMessage}`, true);
            }
        }
    } catch (error) {
        showStatus('error', `❌ Network Error: Could not reach the Netlify Function.`, true);
    }
}

function showStatus(type, message, show) {
    statusMessage.textContent = message;
    statusMessage.className = ''; 
    if (show) {
        statusMessage.classList.add(type);
    } else {
        statusMessage.style.display = 'none';
    }
}

window.onload = loadCurrentData;
</script>
</body>
</html>
